server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: campus-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/campus_booking?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 15000
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:15672}
    username: ${RABBITMQ_USERNAME:campus}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:campus_booking}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 20
        concurrency: 2
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
app:
  activity:
    detail-ttl: 10m
    null-ttl: 30s
    ttl-jitter: 2m
    lock-wait: 3s
    runtime-buffer: 24h
  account:
    code-ttl: 5m
    resend-interval: 60s
    max-code-attempts: 5
    token-ttl: 30m
    dev-sms-enabled: false
